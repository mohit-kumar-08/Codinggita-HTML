<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit Kumar</title>
</head>
<body>
    <table border="1">
        <caption>A Meaningful Caption</caption>
        <thead>
            <tr>
                <th scope="col" id="1">heading 1</th>
                <th scope="col" id="2">heading 2</th>
                <th scope="col" id="3">heading 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2" headers="1">a</td>
                <th rowspan="2" headers="3" scope="row">b</td>
            </tr>
            <tr>
                <td headers="1">c</td>
                <td headers="2">d</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
