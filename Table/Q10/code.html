<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit Kumar</title>
</head>
<body>
    <table border="1">
        <caption>This is a caption</caption>
        <thead>
            <tr>
                <th scope="col" id="1">heading 1</th>
                <th scope="col" id="2">heading 2</th>
                <th scope="col" id="3">heading 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2" headers="1">xyzd</td>
                <td headers="2">abcd</td>
                <td headers="3">efgh</td>
            </tr>
            <tr>
                <td colspan="2" headers="2">sms</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">This is a footer</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
