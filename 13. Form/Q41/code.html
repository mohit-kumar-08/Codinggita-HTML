<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit Kumar</title>
</head>
<body>
    <form action="" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Personal Details</legend>
            <label for="name">Name:</label>
            <input type="text" name="" id="name">
            <label for="email">Email:</label>
            <input type="email" name="" id="email">
            <label for="phone">Phone No.</label>
            <input type="number" name="" id="phone">
        </fieldset>
        <fieldset>
            <legend>Experience</legend>
            <textarea name="" id=""></textarea>
            <input type="file" accept=".pdf" name="" id="">
            <input type="radio" id="yes" name="subscribe" value="yes">
            <label for="yes">Employed</label>
            <input type="radio" id="no" name="subscribe" value="no">
            <label for="no">Unemployed</label>
            <br>
            <label for="t&c">Terms & Conditions</label>
            <input type="checkbox" name="" id="t&c" required>
        </fieldset>
        <input type="submit" name="" id="">
        <button type="submit" formnovalidate>Save Draft</button>
    </form>
</body>
</html>
