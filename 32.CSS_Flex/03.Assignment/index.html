<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit Kumar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="number">
            7744
        </div>
        <div id="option-line-1" class="option-line">
            <div class="gray-button" id="c">C</div>
            <div class="gray-button" id="sign-inversion">+/-</div>
            <div class="gray-button" id="percentage">%</div>
            <div class="gold-button" id="division">÷</div>
        </div>
        <div id="option-line-2" class="option-line">
            <div class="bluegray-button" id="7">7</div>
            <div class="bluegray-button" id="8">8</div>
            <div class="bluegray-button" id="9">9</div>
            <div class="gold-button" id="multiplication">X</div>
        </div>
        <div id="option-line-3" class="option-line">
            <div class="bluegray-button" id="4">4</div>
            <div class="bluegray-button" id="5">5</div>
            <div class="bluegray-button" id="6">6</div>
            <div class="gold-button" id="subtraction">-</div>
        </div>
        <div id="option-line-4" class="option-line">
            <div class="bluegray-button" id="1">1</div>
            <div class="bluegray-button" id="2">2</div>
            <div class="bluegray-button" id="3">3</div>
            <div class="gold-button" id="addition">+</div>
        </div>
        <div id="option-line-5" class="option-line">
            <div class="bluegray-button" id="zero">0</div>
            <div class="bluegray-button" id="comma">,</div>
            <div class="gold-button" id="equal-to">=</div>
        </div>
    </div>
</body>
</html>
